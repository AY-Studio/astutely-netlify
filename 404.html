<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Astutely Agency</title>
    <!-- Netlify serves this for any missing page. Paths are absolute because it
         can be shown at any URL depth (e.g. /work/anything). -->
    <link rel="icon" type="image/jpeg" href="/assets/img/favicon.jpg">
    <style>
      @font-face { font-family: "ModernEra"; src: url("/assets/fonts/ModernEra-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "ModernEra"; src: url("/assets/fonts/ModernEra-ExtraBold.woff2") format("woff2"); font-weight: 800; font-display: swap; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px 16px; background: #111111; color: #FFFFFF; font-family: "ModernEra", system-ui, sans-serif; text-align: center; }
      .code { margin: 0; color: #F3DFA2; font-size: 0.95rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
      h1 { margin: 0.6rem 0 1rem; font-size: clamp(2.4rem, 7vw, 5rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
      p { margin: 0 auto 2rem; max-width: 34ch; font-size: 1.15rem; line-height: 1.5; opacity: 0.8; }
      a { display: inline-block; padding: 0.9rem 1.6rem; border-radius: 999px; background: #F3DFA2; color: #111111; font-weight: 800; text-decoration: none; }
      a:hover, a:focus-visible { background: #FFFFFF; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found.</h1>
      <p>The page you're looking for isn't here. It may have moved, or the link may be out of date.</p>
      <a href="/">Back to the homepage</a>
    </main>
  </body>
</html>
