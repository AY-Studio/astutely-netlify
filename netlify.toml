# Netlify configuration for the Astutely static site.
# No build step yet — the site is published as-is. (When we add Eleventy for the
# news CMS, this becomes: command = "npx @11ty/eleventy", publish = "_site".)

[build]
  publish = "."

# --- Clean URLs -------------------------------------------------------------
# Netlify already serves /contact for contact.html. These redirects send the
# .html versions to the extensionless canonical so there's only ever one URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# --- Work section: in draft, hidden from the live site -----------------------
# Every /work URL returns the 404 page. The files stay in the repo (and work in
# a local preview, which ignores these rules). To bring the section back, delete
# these two rules. This sits above the other /work redirects so it wins.
[[redirects]]
  from = "/work"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/work/*"
  to = "/404.html"
  status = 404
  force = true

# The branded SuperCupNI case study was reviewed as /work/supercupni2 before it
# became the main page; keep that shared link working.
[[redirects]]
  from = "/work/supercupni2"
  to = "/work/supercupni"
  status = 301
  force = true

[[redirects]]
  from = "/work/supercupni2.html"
  to = "/work/supercupni"
  status = 301
  force = true

# --- Sensible default headers ----------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# --- Case studies: hidden while in draft (see the 404 rule above) -------------
# Belt and braces: if the 404 rule is removed before launch, these pages still
# tell search engines not to index them. Each page also has a noindex meta tag.
[[headers]]
  for = "/work/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long-cache the fingerprinted/static assets (they're versioned via ?v=)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
