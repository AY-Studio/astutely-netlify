# Netlify configuration for the Astutely static site.
# No build step yet — the site is published as-is. (When we add Eleventy for the
# news CMS, this becomes: command = "npx @11ty/eleventy", publish = "_site".)

[build]
  publish = "."

# --- Clean URLs -------------------------------------------------------------
# Netlify already serves /contact for contact.html. These redirects send the
# .html versions to the extensionless canonical so there's only ever one URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# --- Work section: temporarily live for review (noindex) ---------------------
# To hide it again, put these two rules back (above the other /work redirects
# so they win). Every /work URL then returns the 404 page.
# [[redirects]]
#   from = "/work"
#   to = "/404.html"
#   status = 404
#   force = true
#
# [[redirects]]
#   from = "/work/*"
#   to = "/404.html"
#   status = 404
#   force = true

# The branded SuperCupNI case study was reviewed as /work/supercupni2 before it
# became the main page; keep that shared link working.
[[redirects]]
  from = "/work/supercupni2"
  to = "/work/supercupni"
  status = 301
  force = true

[[redirects]]
  from = "/work/supercupni2.html"
  to = "/work/supercupni"
  status = 301
  force = true

# --- Sensible default headers ----------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# --- Case studies: in draft, keep out of search engines -----------------------
# Each page also has a noindex meta tag. Remove both blocks at launch.
[[headers]]
  for = "/work"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/work/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Long-cache the fingerprinted/static assets (they're versioned via ?v=)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
